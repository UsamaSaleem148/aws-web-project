name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Repository owner ID: ${{ github.repository_owner_id }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593077778374:role/GitHubActions-SSM-Deploy
          aws-region: ap-southeast-1

      - name: Deploy to EC2 using Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-00ba47fef805b00bc" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd ~/aws-web-project","git pull origin main","sudo cp index.html /var/www/html/index.html"]' \
            --comment "Deploy website from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-00ba47fef805b00bc"

          echo "Deployment completed successfully."
